; Penrith MRT Xebro - ESP32-S3 (Sparkle IoT N16R8) Wi-Fi selector + NAT router
; Native ESP-IDF build (the earlier Arduino version lives in arduino/).
;
; Build:   pio run          (run from PowerShell, not Git Bash)
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf

; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM (see sdkconfig.defaults)
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; Serial console is on UART0 via the on-board CH343 USB-UART bridge
monitor_speed = 115200
upload_speed = 921600
upload_port = COM5
monitor_port = COM5
monitor_filters = esp32_exception_decoder, time
