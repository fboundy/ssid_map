; Penrith MRT Xebro - ESP32-S3 (Sparkle IoT N16R8) Wi-Fi selector + NAT router
; Native ESP-IDF build (the earlier Arduino version lives in arduino/).
;
; Build:   pio run          (run from PowerShell, not Git Bash)
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; Both boards are ESP32-S3 with 16 MB quad flash + 8 MB octal PSRAM (see sdkconfig.defaults)
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

; Sparkle IoT ESP32-S3 N16R8 (headless). Console on UART0 via the CH343 bridge.
[env:esp32s3_n16r8]
upload_port = COM5
monitor_port = COM5

; Waveshare ESP32-S3-Touch-LCD-1.9: adds the ST7789 status display.
; Native USB (USB-Serial-JTAG): flash and logs on the port Windows enumerates
; as "USB JTAG/serial debug unit". Set the port here or pass --upload-port.
[env:ws_touch_lcd_19]
build_flags = -DXEBRO_DISPLAY_WS19
